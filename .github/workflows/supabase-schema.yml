name: Apply Supabase schema

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check database configuration
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL is not configured."
            exit 1
          fi

      - name: Prepare PostgreSQL 17 client
        run: docker pull postgres:17

      - name: Apply versioned schema
        run: |
          docker run --rm \
            -e SUPABASE_DB_URL \
            -v "$PWD/supabase:/schema:ro" \
            postgres:17 \
            sh -c 'psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --file=/schema/schema.sql'
